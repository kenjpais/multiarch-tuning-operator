language: en-US
reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!vendor/**"
    - "!**/zz_generated*.go"
    - "!config/crd/bases/**"
    - "!config/rbac/role.yaml"
    - "!bundle/manifests/**"
    - "!go.sum"
  path_instructions:
    - path: "api/**"
      instructions: "Review for backward compatibility, validation webhook completeness, and CRD marker correctness."
    - path: "internal/controller/podplacement/pod_model.go"
      instructions: "Review exclusion logic correctness, architecture intersection, and gate lifecycle."
    - path: "internal/controller/operator/**"
      instructions: "Review finalizer ordering, resource apply method correctness, and status condition transitions."
    - path: "pkg/image/**"
      instructions: "Review registry auth handling, manifest parsing, and cache invalidation."
    - path: "internal/controller/podplacement/cel_*.go"
      instructions: "Review CEL expression safety, cache bounds, and evaluation correctness."
    - path: "cmd/main.go"
      instructions: "Review flag validation, mode exclusivity, and startup sequence."
    - path: "pkg/utils/const.go"
      instructions: "Review label/annotation key consistency and no duplicate definitions."
  tools:
    ast-grep:
      essential_rules: true
chat:
  auto_reply: true
knowledge_base:
  learnings:
    scope: auto
  jira:
    project_keys: []
  linear:
    team_keys: []
  issues:
    scope: auto
  pull_requests:
    scope: auto
  file_context:
    filePatterns:
      - "REVIEW.md"
      - "AGENTS.md"
